<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Query Workspace — AskMySQL</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body data-page="ask">
  <main class="wrap wide">
    <!-- Navbar -->
    <header class="site">
      <div class="brand-group">
        <a class="mark" href="/">
          <span class="brand-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
          </span>
          <span>AskMySQL</span>
        </a>
      </div>
      <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
        <p id="who"></p>
        <nav>
          <a class="quiet" href="/connect">Database Settings</a>
          <button id="sign-out" class="ghost" type="button">Sign out</button>
        </nav>
      </div>
    </header>

    <!-- Quota & Upgrade Banner -->
    <div class="usage-bar">
      <div class="usage-meter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
        </svg>
        <span id="usage" class="note"></span>
      </div>
      <div id="billing" hidden>
        <button id="billing-action" type="button"></button>
      </div>
    </div>

    <!-- Need Connect Alert -->
    <div id="need-connect" class="panel" style="background: #fffbeb; border-color: #fde68a; color: #92400e; margin-top: 0; margin-bottom: 1.25rem;" hidden>
      <div style="font-weight: 600; margin-bottom: 0.25rem;">Database connection required</div>
      <div>Connect and index a MySQL database before asking questions. <a href="/connect" style="font-weight: 600; margin-left: 0.25rem;">Connect a database &rarr;</a></div>
    </div>

    <p id="error" role="alert"></p>

    <!-- Question Input Console -->
    <form id="ask-form" class="panel" hidden>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
        <label for="question" style="margin: 0;">
          <span style="font-size: 1.05rem; font-weight: 700;">Ask in English</span>
          <span class="label-hint">Generates read-only SQL, executes against your DB, and displays results</span>
        </label>
        <span class="badge badge-indigo">Auto-Routed</span>
      </div>

      <textarea id="question" name="question" placeholder="e.g. How many orders have a paid status?" required maxlength="2000"></textarea>

      <!-- Quick Starter Chips -->
      <div class="query-chips">
        <span style="font-size: 0.78rem; font-weight: 600; color: var(--text-muted);">Quick prompts:</span>
        <button type="button" class="query-chip" data-prompt="How many orders have a paid status?">How many orders have a paid status?</button>
        <button type="button" class="query-chip" data-prompt="Count all customers and orders">Count all customers and orders</button>
        <button type="button" class="query-chip" data-prompt="List 5 most recent orders with status">List 5 most recent orders</button>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; flex-wrap: wrap; gap: 0.5rem;">
        <span class="label-hint">Press <strong>Ask</strong> or <strong>Ctrl + Enter</strong></span>
        <button type="submit" class="button-lg">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          Ask Question
        </button>
      </div>
    </form>

    <!-- Execution Stepper Progress -->
    <ol id="progress" aria-live="polite"></ol>

    <!-- Answer Presentation Section -->
    <section id="answer" class="panel" hidden></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
