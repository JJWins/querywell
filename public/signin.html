<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — AskMySQL</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body data-page="signin">
  <main class="wrap wrap-auth">
    <header class="site" style="margin-bottom: 1.5rem;">
      <a class="mark" href="/">
        <span class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
          </svg>
        </span>
        <span>AskMySQL</span>
      </a>
      <nav>
        <a class="quiet" href="/signup">Create account</a>
      </nav>
    </header>

    <div class="panel-elevated">
      <div style="margin-bottom: 1.25rem;">
        <h2>Sign in to AskMySQL</h2>
        <p class="lede" style="margin-bottom: 0;">Open the workspace that holds your database connection.</p>
      </div>

      <p id="error" role="alert"></p>

      <form id="signin-form">
        <label for="email">
          <span>Email Address</span>
          <input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required maxlength="255">
        </label>

        <label for="password">
          <span>Password</span>
          <input id="password" name="password" type="password" placeholder="••••••••••••" autocomplete="current-password" required minlength="8" maxlength="200">
        </label>

        <button type="submit" class="button-lg" style="margin-top: 0.5rem; width: 100%;">Sign In &rarr;</button>
      </form>

      <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); text-align: center; font-size: 0.88rem;">
        <span style="color: var(--text-muted);">New to AskMySQL?</span>
        <a href="/signup" style="font-weight: 600; margin-left: 0.25rem;">Start free trial</a>
      </div>

      <div style="margin-top: 1.25rem; text-align: center; font-size: 0.78rem; color: var(--text-muted);">
        Encrypted credentials • Read-only MySQL connections only
      </div>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
